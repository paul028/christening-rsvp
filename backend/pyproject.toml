[project]
name = "christening-rsvp-backend"
version = "0.1.0"
description = "Backend for Christening RSVP website"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
